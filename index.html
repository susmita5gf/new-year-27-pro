<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09091c">
    <title>New Year 2027</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <main class="hero">
        <p class="eyebrow"><span></span> Farewell 2026 <span></span></p>

        <section class="countdown" aria-label="New Year 2027">
            <p class="welcome">WELCOME</p>
            <h1>2027</h1>
        </section>

        <p class="message" id="message"></p>

        <button id="celebrate" type="button" aria-live="polite">
            <span class="button-label">Celebrate</span>
            <span aria-hidden="true">✦</span>
        </button>
    </main>

    <script src="script.js"></script>
</body>

</html>
